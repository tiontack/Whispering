services:
  - type: web
    name: whispering
    runtime: node
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/src/data/whispering.db
    disk:
      name: whispering-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
