<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Whispering – 발표자 화면</title>
  <!-- PWA: 홈 화면 추가 시 전체화면으로 실행 -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Whispering" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="theme-color" content="#050510" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #050510;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Section picker overlay ── */
    .picker-overlay {
      position: fixed; inset: 0; background: #050510;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 200; padding: 2rem;
    }
    .picker-overlay.hidden { display: none; }

    .picker-logo {
      font-size: 2rem; font-weight: 800; margin-bottom: 0.3rem;
      background: linear-gradient(135deg, #0d9488, #5eead4, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .picker-subtitle { color: #555; font-size: 0.9rem; margin-bottom: 2.5rem; }

    .picker-card {
      background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 18px;
      padding: 2rem; width: 100%; max-width: 460px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .picker-room-info {
      display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem;
      padding-bottom: 1rem; border-bottom: 1px solid #2a2a4a;
    }
    .picker-room-name { font-size: 1rem; font-weight: 700; }
    .picker-room-code { font-size: 0.78rem; color: #5eead4; background: #042f2e;
      padding: 0.2rem 0.6rem; border-radius: 12px; }

    .picker-section-title { font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.12em; color: #555; font-weight: 700; margin-bottom: 0.8rem; }

    .section-options { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.2rem; }
    .section-option {
      display: flex; align-items: center; gap: 0.8rem;
      background: #0f0f1a; border: 2px solid #2a2a4a; border-radius: 12px;
      padding: 0.9rem 1rem; cursor: pointer; transition: all 0.18s;
    }
    .section-option:hover { border-color: #0f766e; background: #1a1a35; }
    .section-option.selected { border-color: #0d9488; background: #042f2e; }
    .section-option-dot { width: 10px; height: 10px; border-radius: 50%;
      background: #22c55e; flex-shrink: 0; }
    .section-option-dot.empty { background: #444; }
    .section-option-info { flex: 1; }
    .section-option-name { font-size: 0.95rem; font-weight: 600; }
    .section-option-count { font-size: 0.72rem; color: #666; }
    .section-option-check { color: #0d9488; font-size: 1.1rem; }

    .picker-divider {
      text-align: center; color: #333; font-size: 0.75rem; margin: 0.8rem 0;
      position: relative;
    }
    .picker-divider::before, .picker-divider::after {
      content: ''; position: absolute; top: 50%; width: 44%; height: 1px; background: #1a1a3a;
    }
    .picker-divider::before { left: 0; }
    .picker-divider::after  { right: 0; }

    .new-section-row { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; }
    .new-section-row input {
      flex: 1; background: #0f0f1a; border: 1px solid #2a2a4a; border-radius: 10px;
      padding: 0.65rem 0.9rem; color: #e0e0e0; font-size: 0.9rem; outline: none;
    }
    .new-section-row input:focus { border-color: #0d9488; }
    .new-section-row input::placeholder { color: #444; }
    .btn-new-section {
      background: #042f2e; border: 1px solid #0f766e; border-radius: 10px;
      padding: 0.65rem 1rem; color: #5eead4; font-size: 0.85rem; cursor: pointer;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn-new-section:hover { background: #0f3d38; }

    .btn-enter {
      width: 100%; padding: 0.85rem; border-radius: 12px; font-size: 1rem;
      font-weight: 700; cursor: pointer; border: none;
      background: linear-gradient(135deg, #0d9488, #0f766e); color: #fff;
      transition: all 0.2s;
    }
    .btn-enter:hover { background: linear-gradient(135deg, #14b8a6, #0f766e); transform: translateY(-1px); }
    .btn-enter:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    .picker-loading { text-align: center; color: #444; font-size: 0.85rem; padding: 1rem; }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 1.2rem;
      background: rgba(10,10,25,0.95);
      border-bottom: 1px solid #1a1a3a;
      flex-shrink: 0; z-index: 10; transition: opacity 0.5s;
    }
    .topbar.hidden { opacity: 0; pointer-events: none; }

    .logo { font-size: 1.1rem; font-weight: 800;
      background: linear-gradient(135deg, #0d9488, #5eead4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .section-tag {
      font-size: 0.72rem; color: #fff; font-weight: 600;
      background: #042f2e; border: 1px solid #0f766e;
      padding: 0.2rem 0.65rem; border-radius: 12px;
    }

    .top-right { display: flex; align-items: center; gap: 0.8rem; }
    .session-tag { font-size: 0.8rem; color: #666; }
    .session-val { font-size: 0.82rem; color: #5eead4; font-weight: 600; }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .conn-dot.offline { background: #ef4444; }
    .btn-fs {
      background: #1a1a3a; border: 1px solid #2a2a4a; border-radius: 8px;
      padding: 0.35rem 0.7rem; color: #888; cursor: pointer; font-size: 0.8rem;
      transition: all 0.15s;
    }
    .btn-fs:hover { border-color: #0d9488; color: #5eead4; }
    .btn-lobby {
      background: transparent; border: 1px solid #2a2a4a; border-radius: 8px;
      padding: 0.35rem 0.7rem; color: #666; cursor: pointer; font-size: 0.8rem;
      transition: all 0.15s;
    }
    .btn-lobby:hover { border-color: #555; color: #ccc; }

    /* ── Main stage ── */
    .stage {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 2rem; gap: 2rem;
      position: relative; min-height: 0;
    }

    .clock-widget {
      position: absolute; top: 1.2rem; right: 1.5rem;
      font-size: 1rem; color: #555; font-variant-numeric: tabular-nums;
    }

    .section-badge-stage {
      position: absolute; top: 1.2rem; left: 1.5rem;
      font-size: 0.78rem; color: #5eead4; font-weight: 600;
      background: rgba(4,47,46,0.8); border: 1px solid #0d9488;
      padding: 0.25rem 0.7rem; border-radius: 12px;
    }

    .main-display {
      display: flex; flex-direction: column; align-items: center;
      gap: 2rem; width: 100%; max-width: 900px; transition: all 0.4s ease;
    }

    /* ── Message card ── */
    .message-card {
      width: 100%; border-radius: 20px; padding: 2.5rem 3rem;
      display: flex; flex-direction: column; align-items: center;
      gap: 1rem; position: relative; overflow: hidden;
    }
    /* 일반: 초록 계열, 애니메이션 없음 */
    .message-card.normal  { background: linear-gradient(135deg,#071a10,#0d2418); border: 2px solid #16a34a; box-shadow: 0 0 40px rgba(22,163,74,0.15); }
    /* 주의: 깜빡임 — 확인 전까지 */
    .message-card.caution { background: linear-gradient(135deg,#2a1a00,#3a2200); border: 2px solid #d97706; animation: cautionBlink 1s ease-in-out infinite; }
    .message-card.caution.acknowledged { animation: none; box-shadow: 0 0 20px rgba(217,119,6,0.1); }
    /* 긴급: 깜빡임 + 빨간 색상 강조 — 확인 전까지 */
    .message-card.urgent  { background: linear-gradient(135deg,#2a0000,#3a0000); border: 2px solid #dc2626; animation: urgentFlash 1.2s ease-in-out infinite; }
    .message-card.urgent.acknowledged  { animation: none; box-shadow: 0 0 20px rgba(220,38,38,0.1); }

    @keyframes cautionBlink {
      0%,100% { opacity: 1; box-shadow: 0 0 40px rgba(217,119,6,0.35); }
      50%      { opacity: 0.68; box-shadow: 0 0 10px rgba(217,119,6,0.08); }
    }
    @keyframes urgentFlash {
      0%,100% { box-shadow: 0 0 40px rgba(220,38,38,0.35); border-color: #dc2626; background: linear-gradient(135deg,#2a0000,#3a0000); opacity: 1; }
      50%      { box-shadow: 0 0 100px rgba(255,0,0,0.9), 0 0 50px rgba(255,60,60,0.5); border-color: #ff3333; background: linear-gradient(135deg,#560000,#720000); opacity: 0.88; }
    }

    .message-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; opacity: 0.6; }
    .message-text { font-size: clamp(2.2rem,5vw,4.5rem); font-weight: 700; text-align: center; line-height: 1.3; word-break: keep-all; }
    .message-text.normal  { color: #e0e0ff; }
    .message-text.caution { color: #fbbf24; }
    .message-text.urgent  { color: #f87171; }
    .message-time { font-size: 0.75rem; opacity: 0.4; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .message-card.animate { animation: slideIn 0.35s ease; }

    /* ── Timer ── */
    .timer-widget { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
    .timer-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: #555; font-weight: 600; }
    .timer-digits { font-size: clamp(3rem,12vw,7rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.05em; color: #5eead4; transition: color 0.3s; }
    .timer-digits.warning { color: #fbbf24; }
    .timer-digits.danger  { color: #f87171; animation: blink 0.8s step-end infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }

    /* ── Full clock ── */
    .clock-full { font-size: clamp(4rem,15vw,10rem); font-weight: 800; font-variant-numeric: tabular-nums; color: #5eead4; letter-spacing: 0.05em; }
    .clock-date { font-size: clamp(1rem,3vw,1.8rem); color: #555; letter-spacing: 0.1em; }

    /* ── Empty ── */
    .empty-state { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .empty-icon { font-size: 4rem; opacity: 0.3; }
    .empty-text { font-size: 1rem; color: #2a2a4a; }

    /* ── Offline banner ── */
    .offline-banner {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(220,38,38,0.9); color: #fff; text-align: center;
      padding: 0.6rem; font-size: 0.85rem; font-weight: 600;
      transform: translateY(100%); transition: transform 0.3s; z-index: 100;
    }
    .offline-banner.show { transform: translateY(0); }

    /* ── Section deleted notice ── */
    .notice-banner {
      position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
      background: #451a03; border: 1px solid #d97706; color: #fbbf24;
      padding: 0.7rem 1.4rem; border-radius: 12px; font-size: 0.88rem; font-weight: 600;
      z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .notice-banner.show { opacity: 1; }

    body.hide-cursor * { cursor: none !important; }

    /* ── PWA 설치 안내 배너 ── */
    .pwa-banner {
      position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(4,47,46,0.97); border: 1px solid #0d9488; border-radius: 14px;
      padding: 0.75rem 1rem; font-size: 0.82rem; color: #5eead4;
      opacity: 0; transition: all 0.4s; pointer-events: none; z-index: 50;
      display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap;
      backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      max-width: calc(100vw - 2rem);
    }
    .pwa-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .btn-pwa-install {
      background: #0d9488; border: none; border-radius: 8px;
      padding: 0.45rem 1rem; color: #fff; font-size: 0.82rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: background 0.15s;
    }
    .btn-pwa-install:hover { background: #14b8a6; }
    .btn-pwa-close {
      background: none; border: none; color: #5eead4; cursor: pointer;
      font-size: 1rem; padding: 0.1rem; line-height: 1; margin-left: auto;
    }

    /* ── iOS 설치 가이드 모달 ── */
    .ios-guide {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 200; transition: opacity 0.3s;
    }
    .ios-guide.hidden { display: none; }
    .ios-guide-box {
      background: #1a1a2e; border: 1px solid #0d9488; border-radius: 20px 20px 0 0;
      padding: 1.5rem 1.5rem 2.5rem; width: 100%; max-width: 480px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .ios-guide-title { font-size: 1.1rem; font-weight: 800; color: #5eead4; margin-bottom: 1rem; text-align: center; }
    .ios-steps { list-style: none; display: flex; flex-direction: column; gap: 0.9rem; margin-bottom: 1.3rem; }
    .ios-steps li {
      display: flex; align-items: flex-start; gap: 0.8rem;
      background: #0f0f1a; border-radius: 10px; padding: 0.7rem 0.9rem; font-size: 0.9rem; color: #ccc;
    }
    .ios-steps li .step-num {
      background: #0d9488; color: #fff; border-radius: 50%;
      width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 800; flex-shrink: 0;
    }
    .ios-steps li strong { color: #5eead4; }
    .btn-ios-close {
      width: 100%; padding: 0.75rem; border-radius: 10px; border: 1px solid #2a2a4a;
      background: transparent; color: #888; font-size: 0.9rem; cursor: pointer;
    }

    /* ── Ack button ── */
    .btn-ack {
      margin-top: 0.5rem; padding: 0.8rem 2.5rem; border-radius: 14px;
      border: 2px solid #16a34a; background: #14532d; color: #4ade80;
      font-size: clamp(1rem,2.5vw,1.4rem); font-weight: 700; cursor: pointer;
      transition: all 0.2s; animation: ackPulse 1.5s ease-in-out infinite;
    }
    .btn-ack:hover { background: #166534; transform: scale(1.05); animation: none; }
    @keyframes ackPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.4); }
      50%      { box-shadow: 0 0 0 10px rgba(74,222,128,0); }
    }
    .ack-done { color: #4ade80; font-size: 0.9rem; font-weight: 600; opacity: 0.7; margin-top: 0.3rem; }
    /* acknowledged 스타일은 각 urgency 블록에 포함됨 */

    /* ── Stage fullscreen button ── */
    .btn-stage-fs {
      position: absolute; bottom: 1.5rem; right: 1.5rem;
      background: rgba(10,10,25,0.85); border: 1px solid #3a3a5a; border-radius: 10px;
      padding: 0.6rem 1.1rem; color: #aaa; cursor: pointer; font-size: 0.9rem;
      transition: opacity 0.3s, border-color 0.2s, color 0.2s; z-index: 5;
      backdrop-filter: blur(6px);
    }
    .btn-stage-fs:hover { border-color: #0d9488; color: #5eead4; background: rgba(13,148,136,0.2); }
    .btn-stage-fs.hidden { opacity: 0; pointer-events: none; }

    /* ── CSS Fake Fullscreen (모바일 폴백) ── */
    .stage.css-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      z-index: 100;
      width: 100% !important;
      height: 100dvh !important;
      background: #050510;
      overflow: hidden;
    }
    /* ── Native fullscreen: 브라우저 크롬까지 완전히 덮음 ── */
    :fullscreen          .topbar { display: none !important; }
    :-webkit-full-screen .topbar { display: none !important; }
    :-moz-full-screen    .topbar { display: none !important; }
    /* 전체화면 종료 버튼: 항상 보이게 */
    :fullscreen          .btn-stage-fs.hidden { opacity: 1 !important; pointer-events: auto !important; }
    :-webkit-full-screen .btn-stage-fs.hidden { opacity: 1 !important; pointer-events: auto !important; }

    /* ── Mobile / Tablet Responsive ── */
    @media (max-width: 768px) {
      .topbar { padding: 0.5rem 0.9rem; }
      .session-tag { display: none; }
      .stage { padding: 1.2rem; gap: 1.2rem; }
      .message-card { padding: 2rem 1.5rem; }
      .btn-stage-fs {
        bottom: 1.2rem; right: 1.2rem;
        padding: 0.75rem 1.1rem; font-size: 0.95rem;
        min-height: 44px;
      }
      .btn-quick-msg { bottom: 1.2rem; left: 1.2rem; min-height: 44px; }
      .quick-msg-panel { bottom: 4.8rem; left: 1.2rem; }
    }
    @media (max-width: 480px) {
      .logo { font-size: 0.95rem; }
      .session-val { display: none; }
      .btn-fs { display: none; } /* 상단 버튼 숨김, 화면 내 버튼 사용 */
      .btn-lobby { padding: 0.3rem 0.5rem; font-size: 0.72rem; }
      .stage { padding: 0.8rem; gap: 0.8rem; }
      .message-card { padding: 1.5rem 1rem; border-radius: 14px; }
      .clock-widget { font-size: 0.78rem; top: 0.6rem; right: 0.7rem; }
      .section-badge-stage { font-size: 0.7rem; top: 0.6rem; left: 0.7rem; padding: 0.18rem 0.5rem; }
      .btn-stage-fs {
        bottom: 0.9rem; right: 0.9rem;
        padding: 0.85rem 1.3rem; font-size: 1rem;
        border-radius: 12px; min-height: 48px;
      }
      .btn-quick-msg { bottom: 0.9rem; left: 0.9rem; border-radius: 12px; min-height: 48px; padding: 0.85rem 1rem; font-size: 0.9rem; }
      .quick-msg-panel { left: 0.9rem; bottom: 4.5rem; max-width: calc(100vw - 1.8rem); }
      .empty-icon { font-size: 2.8rem; }
      .empty-text { font-size: 0.88rem; }
      /* 입력 줌 방지 (iOS) */
      .picker-card input { font-size: 16px !important; }
    }
    @media (max-width: 480px) {
      .picker-overlay { padding: 0.8rem; }
      .picker-card { padding: 1.4rem 1rem; }
      .picker-logo { font-size: 1.7rem; }
    }
    /* 터치 기기: 더블탭 줌 방지 */
    button { touch-action: manipulation; }

    /* ── Quick message to coordinator ── */
    .btn-quick-msg {
      position: absolute; bottom: 1.5rem; left: 1.5rem;
      background: rgba(10,10,25,0.85); border: 1px solid #3a3a5a; border-radius: 10px;
      padding: 0.6rem 1.1rem; color: #aaa; cursor: pointer; font-size: 0.9rem;
      transition: all 0.2s; z-index: 5; backdrop-filter: blur(6px);
    }
    .btn-quick-msg:hover { border-color: #5b21b6; color: #c4b5fd; background: rgba(91,33,182,0.2); }

    .quick-msg-panel {
      position: absolute; bottom: 4.5rem; left: 1.5rem;
      background: rgba(15,15,30,0.97); border: 1px solid #2a2a4a; border-radius: 14px;
      padding: 0.9rem; display: flex; flex-direction: column; gap: 0.45rem;
      z-index: 6; min-width: 200px; max-width: 260px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7); backdrop-filter: blur(10px);
      transform-origin: bottom left;
      animation: qpIn 0.18s ease;
    }
    .quick-msg-panel.hidden { display: none; }
    @keyframes qpIn { from { opacity:0; transform: scale(0.92) translateY(6px); } to { opacity:1; transform: scale(1) translateY(0); } }

    .qp-title {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: #555; font-weight: 700; padding: 0 0.2rem 0.3rem; border-bottom: 1px solid #1a1a3a;
    }
    .qp-btn {
      background: #0f0f1a; border: 1px solid #2a2a4a; border-radius: 8px;
      padding: 0.55rem 0.8rem; color: #ccc; cursor: pointer; font-size: 0.85rem;
      text-align: left; transition: all 0.15s; width: 100%;
    }
    .qp-btn:hover { border-color: #7c3aed; color: #c4b5fd; background: #1a0a35; }
    .qp-btn:active { transform: scale(0.97); }
    .qp-sent {
      font-size: 0.75rem; color: #4ade80; text-align: center;
      padding: 0.3rem; animation: fadeOut 1.5s ease forwards;
    }
    @keyframes fadeOut { 0%,60% { opacity:1; } 100% { opacity:0; } }

    /* ── Picker refresh button ── */
    .btn-picker-refresh {
      background: transparent; border: 1px solid #2a2a4a; border-radius: 8px;
      padding: 0.28rem 0.65rem; color: #666; cursor: pointer; font-size: 0.75rem;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn-picker-refresh:hover { border-color: #0d9488; color: #5eead4; }
    .btn-picker-refresh.spinning { animation: spin 0.6s linear; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── Section picker overlay ── -->
<div class="picker-overlay" id="pickerOverlay">
  <div style="display:flex;align-items:center;gap:0.7rem;margin-bottom:0.3rem;">
    <img src="/sk-logo.svg" alt="SK" style="height:28px;width:auto;" />
    <div style="width:1px;height:20px;background:#2a2a4a;"></div>
    <div class="picker-logo" style="margin-bottom:0;">Whispering</div>
  </div>
  <p class="picker-subtitle">분과를 선택하고 입장하세요</p>

  <div class="picker-card">
    <div class="picker-room-info">
      <span class="picker-room-name" id="pickerRoomName">—</span>
      <span class="picker-room-code" id="pickerRoomCode">—</span>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.8rem;">
      <div class="picker-section-title" style="margin-bottom:0;">분과 선택</div>
      <button class="btn-picker-refresh" id="btnPickerRefresh" onclick="refreshSections()">↻ 새로고침</button>
    </div>
    <div class="section-options" id="sectionOptions">
      <div class="picker-loading">불러오는 중…</div>
    </div>

    <div class="picker-divider">또는 새 분과 입력</div>
    <div class="new-section-row">
      <input type="text" id="newSectionInput" placeholder="분과 이름 입력 (예: 1분과, A팀)" maxlength="20"
        onkeydown="if(event.key==='Enter') enterWithNewSection()" />
      <button class="btn-new-section" onclick="enterWithNewSection()">입장</button>
    </div>

    <button class="btn-enter" id="btnEnter" onclick="enterRoom()" disabled>입장하기</button>
  </div>
</div>

<!-- ── Presenter UI ── -->
<div class="topbar" id="topbar">
  <div style="display:flex;align-items:center;gap:0.6rem;">
    <img src="/sk-logo.svg" alt="SK" style="height:24px;width:auto;" />
    <div style="width:1px;height:18px;background:#2a2a4a;flex-shrink:0;"></div>
    <div class="logo">Whispering</div>
    <span class="session-val" id="roomNameDisplay" style="font-size:0.88rem;color:#e0e0e0;font-weight:700;">—</span>
    <span class="section-tag" id="sectionTagTop"></span>
  </div>
  <div class="top-right">
    <span class="session-tag">방 코드</span>
    <span class="session-val" id="sessionDisplay">—</span>
    <div class="conn-dot offline" id="connDot"></div>
    <button class="btn-fs" id="btnFs" onclick="toggleFullscreen()">⛶ 전체화면</button>
    <button class="btn-lobby" onclick="location.href='/'">← 로비</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="clock-widget" id="clockWidget"></div>
  <div class="section-badge-stage" id="sectionBadge"></div>
  <div class="main-display" id="mainDisplay"></div>
  <button class="btn-stage-fs" id="btnStageFs" onclick="toggleFullscreen()" title="전체화면 (더블클릭도 가능)">⛶ 전체화면</button>

  <!-- 담당자에게 빠른 메시지 -->
  <button class="btn-quick-msg" id="btnQuickMsg" onclick="toggleQuickPanel()">💬 담당자에게</button>
  <div class="quick-msg-panel hidden" id="quickPanel">
    <div class="qp-title">담당자에게 전달</div>
    <div id="quickPanelBtns"><div style="color:#444;font-size:0.78rem;text-align:center;padding:0.3rem;">불러오는 중…</div></div>
  </div>
</div>

<div class="offline-banner" id="offlineBanner">⚠️ 연결이 끊어졌습니다. 재연결 중…</div>
<div class="notice-banner" id="noticeBanner"></div>
<!-- PWA 설치 배너 -->
<div class="pwa-banner" id="pwaBanner">
  <span>📲 완전한 전체화면</span>
  <button class="btn-pwa-install" id="btnPwaInstall" onclick="triggerPwaInstall()">홈 화면에 추가</button>
  <button class="btn-pwa-close" onclick="document.getElementById('pwaBanner').classList.remove('show')">✕</button>
</div>

<!-- iOS 설치 가이드 모달 -->
<div class="ios-guide hidden" id="iosGuide">
  <div class="ios-guide-box">
    <div class="ios-guide-title">📲 홈 화면에 추가하는 방법</div>
    <ol class="ios-steps">
      <li>
        <span class="step-num">1</span>
        <span>Safari 하단 가운데 <strong>공유 버튼 ↑</strong>을 탭하세요</span>
      </li>
      <li>
        <span class="step-num">2</span>
        <span>메뉴를 아래로 스크롤해서 <strong>'홈 화면에 추가'</strong>를 탭하세요</span>
      </li>
      <li>
        <span class="step-num">3</span>
        <span>오른쪽 상단 <strong>'추가'</strong>를 탭하면 완료! 앱처럼 전체화면으로 실행됩니다</span>
      </li>
    </ol>
    <button class="btn-ios-close" onclick="document.getElementById('iosGuide').classList.add('hidden')">닫기</button>
  </div>
</div>

<script>
  // ── Params ──
  const params      = new URLSearchParams(location.search);
  const SESSION     = params.get('room') || params.get('session') || 'default';
  const ROOM_NAME   = params.get('name') || SESSION;
  const ROOM_PW     = params.get('pw') || '';
  const SEC_ID_INIT = params.get('section')  || '';
  const SEC_NM_INIT = params.get('sectionName') || SEC_ID_INIT;

  let SECTION_ID   = SEC_ID_INIT;
  let SECTION_NAME = SEC_NM_INIT;

  let messageAcked = false;
  let ws, currentMessage = null, timerState = null, displayMode = 'both';
  let timerInterval, timerSecondsLeft = 0;
  let idleTimer, clockFullInterval;
  let selectedSectionId = '', selectedSectionName = '';

  // ── Basic display setup ──
  document.getElementById('sessionDisplay').textContent  = SESSION;
  document.getElementById('roomNameDisplay').textContent = ROOM_NAME;
  document.getElementById('pickerRoomName').textContent  = ROOM_NAME;
  document.getElementById('pickerRoomCode').textContent  = SESSION;

  // ── Clock ──
  function updateClock() {
    const now = new Date();
    document.getElementById('clockWidget').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
  function pad(n) { return String(n).padStart(2,'0'); }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Section picker ──
  async function initPicker() {
    if (SECTION_ID) {
      // URL has section already → skip picker
      hidePicker();
      connect();
      return;
    }

    // Load section list from server
    try {
      const res  = await fetch(`/api/rooms/${encodeURIComponent(SESSION)}`);
      const data = await res.json();
      renderPickerSections(data.sections || []);
    } catch {
      renderPickerSections([]);
    }
  }

  async function refreshSections() {
    const btn = document.getElementById('btnPickerRefresh');
    btn.classList.add('spinning');
    btn.disabled = true;
    try {
      const res  = await fetch(`/api/rooms/${encodeURIComponent(SESSION)}`);
      const data = await res.json();
      renderPickerSections(data.sections || []);
    } catch {
      renderPickerSections([]);
    }
    setTimeout(() => { btn.classList.remove('spinning'); btn.disabled = false; }, 600);
  }

  function renderPickerSections(sections) {
    const opts = document.getElementById('sectionOptions');
    if (sections.length === 0) {
      opts.innerHTML = '<div style="color:#444;font-size:0.82rem;text-align:center;padding:0.5rem;">아직 등록된 분과가 없습니다<br><span style="color:#333">아래에서 새 분과를 입력해 주세요</span></div>';
      return;
    }

    opts.innerHTML = sections.map(s => `
      <div class="section-option" id="opt-${escAttr(s.id)}"
           onclick="selectSection('${escAttr(s.id)}','${escAttr(s.name)}')">
        <div class="section-option-dot ${s.presenterCount === 0 ? 'empty' : ''}"></div>
        <div class="section-option-info">
          <div class="section-option-name">${escHtml(s.name)}</div>
          <div class="section-option-count">발표자 ${s.presenterCount}명 접속 중</div>
        </div>
        <span class="section-option-check" style="display:none" id="chk-${escAttr(s.id)}">✓</span>
      </div>
    `).join('');
  }

  function selectSection(id, name) {
    // Deselect previous
    if (selectedSectionId) {
      const prev = document.getElementById(`opt-${selectedSectionId}`);
      const chk  = document.getElementById(`chk-${selectedSectionId}`);
      if (prev) prev.classList.remove('selected');
      if (chk)  chk.style.display = 'none';
    }
    selectedSectionId   = id;
    selectedSectionName = name;
    const el  = document.getElementById(`opt-${id}`);
    const chk = document.getElementById(`chk-${id}`);
    if (el)  el.classList.add('selected');
    if (chk) chk.style.display = '';
    document.getElementById('btnEnter').disabled = false;
    document.getElementById('newSectionInput').value = '';
  }

  function enterRoom() {
    if (!selectedSectionId) return;
    SECTION_ID   = selectedSectionId;
    SECTION_NAME = selectedSectionName;
    hidePicker();
    connect();
  }

  function enterWithNewSection() {
    const name = document.getElementById('newSectionInput').value.trim();
    if (!name) return;
    SECTION_ID   = 'sec-' + Date.now();
    SECTION_NAME = name;
    hidePicker();
    connect();
  }

  function hidePicker() {
    document.getElementById('pickerOverlay').classList.add('hidden');
    updateSectionUI();
  }

  function updateSectionUI() {
    const tag    = document.getElementById('sectionTagTop');
    const badge  = document.getElementById('sectionBadge');
    const label  = SECTION_NAME || SECTION_ID;
    if (label) {
      tag.textContent   = label;
      badge.textContent = `📌 ${label}`;
    }
  }

  // ── WebSocket ──
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        type: 'join', roomId: SESSION,
        payload: { role: 'presenter', name: ROOM_NAME, sectionId: SECTION_ID, sectionName: SECTION_NAME, password: ROOM_PW },
      }));
      setConnected(true);
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      switch (msg.type) {
        case 'joined':
          // Server confirmed section name
          if (msg.payload.sectionName) SECTION_NAME = msg.payload.sectionName;
          updateSectionUI();
          render();
          break;
        case 'message':
          currentMessage = msg.payload; messageAcked = false; render(); break;
        case 'clear_message':
          currentMessage = null; messageAcked = false; render(); break;
        case 'timer':
          handleTimer(msg.payload); break;
        case 'clear_timer':
          clearTimer(); break;
        case 'display_mode':
          displayMode = msg.payload.mode; render(); break;
        case 'section_renamed':
          if (msg.payload.sectionId === SECTION_ID) {
            SECTION_NAME = msg.payload.sectionName;
            updateSectionUI();
          }
          break;
        case 'section_deleted':
          if (msg.payload.sectionId === SECTION_ID) {
            showNotice('담당자가 이 분과를 삭제했습니다. 잠시 후 새로고침됩니다.');
            setTimeout(() => location.reload(), 3000);
          }
          break;
        case 'join_denied':
          alert(`입장 실패: ${msg.payload.reason}`);
          location.href = '/';
          break;
      }
    };

    ws.onclose = () => { setConnected(false); setTimeout(connect, 3000); };
    ws.onerror = () => ws.close();
  }

  function setConnected(on) {
    document.getElementById('connDot').className = 'conn-dot' + (on ? '' : ' offline');
    document.getElementById('offlineBanner').classList.toggle('show', !on);
  }

  // ── Timer ──
  function handleTimer(payload) {
    clearInterval(timerInterval);
    timerState = payload;
    if (payload.running && payload.startedAt) {
      const elapsed = Math.floor((Date.now() - payload.startedAt) / 1000);
      timerSecondsLeft = Math.max(0, payload.seconds - elapsed);
      timerInterval = setInterval(() => {
        timerSecondsLeft = Math.max(0, timerSecondsLeft - 1);
        render();
        if (timerSecondsLeft <= 0) clearInterval(timerInterval);
      }, 1000);
    } else {
      timerSecondsLeft = payload.seconds;
    }
    render();
  }

  function clearTimer() {
    clearInterval(timerInterval);
    timerState = null;
    timerSecondsLeft = 0;
    render();
  }

  // ── Render ──
  function render() {
    const display   = document.getElementById('mainDisplay');
    const showMsg   = (displayMode === 'both' || displayMode === 'message') && currentMessage;
    const showTimer = (displayMode === 'both' || displayMode === 'timer')   && timerState;
    const showClock = displayMode === 'clock';

    display.innerHTML = '';
    clearInterval(clockFullInterval);

    if (showClock) { display.appendChild(buildClockFull()); return; }
    if (!showMsg && !showTimer) { display.appendChild(buildEmpty()); return; }
    if (showMsg)   display.appendChild(buildMessage(currentMessage));
    if (showTimer) display.appendChild(buildTimer());
  }

  function buildMessage(msg) {
    const card = document.createElement('div');
    const needsAck = (msg.urgency === 'caution' || msg.urgency === 'urgent') && !messageAcked;
    card.className = `message-card ${msg.urgency} animate${messageAcked ? ' acknowledged' : ''}`;
    const labelMap = { normal: '📋 메시지', caution: '⚠️ 주의', urgent: '🚨 긴급' };
    const timeStr  = new Date(msg.timestamp).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    card.innerHTML = `
      <div class="message-label">${labelMap[msg.urgency] || '메시지'}</div>
      <div class="message-text ${msg.urgency}">${escHtml(msg.text)}</div>
      <div class="message-time">${timeStr} 수신</div>
      ${needsAck
        ? '<button class="btn-ack" onclick="ackMessage()">✓ 확인</button>'
        : (messageAcked && msg.urgency !== 'normal' ? '<div class="ack-done">✓ 확인 완료</div>' : '')}
    `;
    return card;
  }

  function ackMessage() {
    messageAcked = true;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'ack_message', roomId: SESSION }));
    }
    render();
  }

  function buildTimer() {
    const widget = document.createElement('div');
    widget.className = 'timer-widget';
    const m = Math.floor(timerSecondsLeft / 60);
    const s = timerSecondsLeft % 60;
    let cls = '';
    if (timerSecondsLeft <= 60 && timerSecondsLeft > 0) cls = 'warning';
    if (timerSecondsLeft <= 10 && timerSecondsLeft > 0) cls = 'danger';
    if (timerSecondsLeft === 0 && timerState) cls = 'danger';
    widget.innerHTML = `
      <div class="timer-label">⏱️ 남은 시간</div>
      <div class="timer-digits ${cls}">${pad(m)}:${pad(s)}</div>
    `;
    return widget;
  }

  function buildClockFull() {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:0.8rem;';

    function nowStr() {
      const n = new Date();
      const ds = ['일','월','화','수','목','금','토'];
      return {
        time: `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`,
        date: `${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 (${ds[n.getDay()]})`,
      };
    }

    const { time, date } = nowStr();
    wrap.innerHTML = `<div class="clock-full">${time}</div><div class="clock-date">${date}</div>`;

    clockFullInterval = setInterval(() => {
      const { time: t, date: d } = nowStr();
      const cf = wrap.querySelector('.clock-full');
      const cd = wrap.querySelector('.clock-date');
      if (cf) cf.textContent = t;
      if (cd) cd.textContent = d;
    }, 1000);

    return wrap;
  }

  function buildEmpty() {
    const div = document.createElement('div');
    div.className = 'empty-state';
    div.innerHTML = '<div class="empty-icon">💬</div><div class="empty-text">교육 담당자의 메시지를 기다리는 중…</div>';
    return div;
  }

  // ── Fullscreen (네이티브 + CSS 폴백, 모바일 지원) ──
  let cssFullscreen = false;

  function isNativeFs() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
  }

  function toggleFullscreen() {
    if (isNativeFs()) {
      (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
      return;
    }
    if (cssFullscreen) { exitCssFs(); return; }

    // documentElement로 fullscreen → 브라우저 탭/주소창까지 완전히 덮음
    const el = document.documentElement;
    const reqFs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
    if (reqFs) {
      reqFs.call(el).catch(() => enterCssFs()); // 네이티브 실패 시 CSS 폴백
    } else {
      enterCssFs(); // 미지원 브라우저(구형 iOS 등) CSS 폴백
    }
  }

  function enterCssFs() {
    cssFullscreen = true;
    document.getElementById('stage').classList.add('css-fullscreen');
    document.getElementById('topbar').classList.add('hidden');
    setFsText(true);
    startIdleTimer();
    document.body.style.overflow = 'hidden';
  }

  function exitCssFs() {
    cssFullscreen = false;
    document.getElementById('stage').classList.remove('css-fullscreen');
    document.getElementById('topbar').classList.remove('hidden');
    setFsText(false);
    clearTimeout(idleTimer);
    document.getElementById('btnStageFs').classList.remove('hidden');
    document.body.style.overflow = '';
  }

  function setFsText(inFs) {
    const text = inFs ? '✕ 전체화면 종료' : '⛶ 전체화면';
    document.getElementById('btnFs').textContent = text;
    document.getElementById('btnStageFs').textContent = text;
  }

  function onNativeFsChange() {
    const inFs = isNativeFs();
    setFsText(inFs);
    if (inFs) startIdleTimer();
    else {
      clearTimeout(idleTimer);
      document.getElementById('btnStageFs').classList.remove('hidden');
    }
  }
  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange'].forEach(ev =>
    document.addEventListener(ev, onNativeFsChange)
  );

  function startIdleTimer() {
    clearTimeout(idleTimer);
    document.getElementById('btnStageFs').classList.remove('hidden');
    idleTimer = setTimeout(() => {
      document.getElementById('btnStageFs').classList.add('hidden');
    }, 3000);
  }

  // 마우스/터치 움직임 → 버튼 표시
  document.addEventListener('mousemove', () => {
    if (isNativeFs() || cssFullscreen) startIdleTimer();
  });
  document.addEventListener('touchmove', () => {
    if (isNativeFs() || cssFullscreen) startIdleTimer();
  }, { passive: true });

  // 더블클릭 (데스크톱)
  document.getElementById('stage').addEventListener('dblclick', (e) => {
    if (e.target.tagName !== 'BUTTON') toggleFullscreen();
  });

  // 더블탭 (모바일)
  let lastTap = 0;
  document.getElementById('stage').addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTap < 300 && e.target.tagName !== 'BUTTON') {
      toggleFullscreen();
      e.preventDefault();
    }
    lastTap = now;
  }, { passive: false });

  // ── Quick message to coordinator ──
  function toggleQuickPanel() {
    const panel = document.getElementById('quickPanel');
    panel.classList.toggle('hidden');
  }

  function sendPresenterMsg(text) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'presenter_message', roomId: SESSION, payload: { text } }));
    }
    // 피드백 표시 후 패널 닫기
    const panel = document.getElementById('quickPanel');
    const sent = document.createElement('div');
    sent.className = 'qp-sent';
    sent.textContent = '✓ 전송됨';
    panel.appendChild(sent);
    setTimeout(() => { sent.remove(); panel.classList.add('hidden'); }, 1000);
  }

  // 패널 외부 클릭 시 닫기
  document.addEventListener('click', (e) => {
    const panel = document.getElementById('quickPanel');
    const btn   = document.getElementById('btnQuickMsg');
    if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== btn) {
      panel.classList.add('hidden');
    }
  });

  // ── Notice ──
  function showNotice(msg) {
    const el = document.getElementById('noticeBanner');
    el.textContent = msg;
    el.classList.add('show');
  }

  // ── Utils ──
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escAttr(s) {
    return String(s).replace(/'/g,"\\'").replace(/"/g,'\\"');
  }

  // ── 발표자 프리셋 로딩 ──
  async function loadPresenterPresets() {
    try {
      const res  = await fetch('/api/presets');
      const data = await res.json();
      const msgs = data.presenter || [];
      const container = document.getElementById('quickPanelBtns');
      if (msgs.length === 0) {
        container.innerHTML = '<div style="color:#444;font-size:0.78rem;text-align:center;padding:0.3rem;">등록된 메시지가 없습니다</div>';
        return;
      }
      container.innerHTML = msgs.map(text =>
        `<button class="qp-btn" onclick="sendPresenterMsg('${escAttr(text)}')">${escHtml(text)}</button>`
      ).join('');
    } catch { /* 오류 시 유지 */ }
  }

  // ── PWA: Service Worker 등록 ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  // ── PWA 설치 자동화 ──
  let _deferredInstall = null;
  const isStandalone =
    window.matchMedia('(display-mode: fullscreen)').matches ||
    window.matchMedia('(display-mode: standalone)').matches ||
    !!window.navigator.standalone;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  // Android Chrome: 설치 프롬프트 이벤트 캡처
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    _deferredInstall = e;
    if (!isStandalone) showPwaBanner();
  });

  window.addEventListener('appinstalled', () => {
    _deferredInstall = null;
    document.getElementById('pwaBanner').classList.remove('show');
  });

  function triggerPwaInstall() {
    if (_deferredInstall) {
      // Android Chrome: 네이티브 설치 다이얼로그 실행 (완전 자동화)
      _deferredInstall.prompt();
      _deferredInstall.userChoice.then(() => { _deferredInstall = null; });
      document.getElementById('pwaBanner').classList.remove('show');
    } else if (isIOS) {
      // iOS Safari: 단계별 안내 모달 표시
      document.getElementById('iosGuide').classList.remove('hidden');
    }
  }

  function showPwaBanner() {
    const banner = document.getElementById('pwaBanner');
    if (!banner) return;
    // iOS는 Safari에서만 설치 가능
    if (isIOS && !/Safari/.test(navigator.userAgent)) return;
    setTimeout(() => banner.classList.add('show'), 1500);
    setTimeout(() => banner.classList.remove('show'), 10000);
  }

  // iOS: 모바일이고 standalone 아니면 배너 표시 (beforeinstallprompt 없으므로 수동 트리거)
  if (!isStandalone && isIOS) showPwaBanner();
  // 기타 모바일(Android but no prompt yet)
  else if (!isStandalone && isMobile && !isIOS) {
    // beforeinstallprompt를 기다림, 없으면 3초 후 배너 (가이드 용도)
    setTimeout(() => { if (!_deferredInstall) showPwaBanner(); }, 3000);
  }

  // ── Init ──
  loadPresenterPresets();
  initPicker();
</script>
</body>
</html>
